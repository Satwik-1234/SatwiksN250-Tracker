name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Non-blocking: the repo has ~140 pre-existing lint findings inherited
      # from before CI existed. Treated as a ratchet, not a gate, so it cannot
      # block unrelated work. Typecheck and build below are hard gates.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      # Hard gate: catches API routes querying columns the schema does not
      # define, which fails at runtime as 42703 and silently falls back to
      # hardcoded seed data.
      - name: Check schema consistency
        run: npm run db:check

      # Hard gate: the fuel-economy figures have been wrong before. Pins the
      # full-tank-to-full-tank math, including the partial-top-up case that the
      # old formula silently got wrong.
      - name: Check mileage math
        run: npm run mileage:check

      # Hard gate: schema.sql is generated from src/lib/dbSchema.ts, so a drift
      # between them must never reach the Supabase SQL editor.
      - name: Verify schema.sql is up to date
        run: |
          npm run db:schema
          if ! git diff --quiet -- schema.sql; then
            echo "::error::schema.sql is out of date. Run 'npm run db:schema' and commit the result."
            git diff -- schema.sql
            exit 1
          fi

      # Placeholder build-time values only. Never bake real secrets here:
      # OWNER_PIN / OWNER_PASSWORD / DATABASE_URL are server-only and are
      # read at runtime from the Vercel environment, not inlined at build.
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
